# DRAFT — pola sama seperti build-mame2003-plus-ps3.yml (v7):
# tiap SELF PS3 = RetroArch frontend + 1 core, static link.
# Bedanya cuma core-nya: pcsx_rearmed, yang Makefile.libretro-nya SUDAH punya
# target platform=psl1ght:
#   - TARGET := pcsx_rearmed_libretro_psl1ght.a (static, pas buat SELF)
#   - CFLAGS += -DBLARGG_BIG_ENDIAN=1 -D__ppc__ (endian PS3 di-handle)
#   - DYNAREC default = lightrec (bukan interpreter!) — Lightrec README klaim
#     support PowerPC via GNU Lightning; precedent big-endian PPC = target
#     wii/ngc di Makefile yang sama.
#   - PATCH (2026-10-07, Fendi): default pcsx_rearmed_drc -> "disabled"
#     (interpreter). Tiap build baru langsung jalan tanpa config custom;
#     dynarec bisa dinyalakan via Core Options untuk ngetes fix.
#     Alasan: lightrec + PS3 = hang saat load game (terbukti via tes
#     interpreter; BIOS asli tidak menyelesaikan).
#   - FIX lightrec (2026-10-07, breakthrough dari Fendi): malloc di PS3 TIDAK
#     executable -> JIT hang. Solusi: code buffer via ps3mapi
#     (Cobra/Mamba CFW syscall 8, is_executable=1).
#     Ref: https://github.com/OsirizX/ps3mapi-lib
#     Ref: https://github.com/irixxxx/picodrive/pull/82
#     FALLBACK: kalau ps3mapi tidak tersedia, paksa interpreter otomatis
#     (pola 3DS __ctr_svchax). Probe sekali saat opsi DRC dibaca.
#     -D__PSL1GHT__ ditambahkan sebagai guard.
#   - EKSPERIMEN: -D__powerpc__ ditambahkan di block psl1ght
#     (Wii pakai -D__ppc__ -D__powerpc__). Harmless kalau redundan.
#     CATATAN: TOC/OPD fix (PicoDrive PR #82) di-port ke Lightning
#     jit_ppc-cpu.c (_callr + _calli) pada 2026-10-07.
#   - BUILTIN_GPU default = peops (soft GPU, BUILTIN_GPU ?= peops)
#   - CC = $(PS3DEV)/ppu/bin/ppu-gcc (butuh PS3DEV di env — di-set step Toolchain)
# Target psl1ght TIDAK di-CI upstream -> build ini belum terverifikasi;
# Fendi jadi tester pertama. Cek di log step "Build core": baris
# "DYNAREC: lightrec" dan "BUILTIN_GPU: peops" (Makefile nge-print info).
#
# Pelajaran dari run mame2003-plus yang dibawa ke sini:
#  - container --user root (git clone permission denied kalau non-root)
#  - jangan pakai `zip` manual (tidak ada di container)
#  - sparse checkout retroarch-assets pakai pola --no-checkout
#  - patch EMULATOR_CONTENT_DIR -> sharing config/aset/save dengan CE
#  - patch CE return-to-menu (UNLOAD_CORE -> RESTART -> exitspawn SELF sendiri)

name: Build pcsx_rearmed PS3 SELF

on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'pcsx_rearmed ref (branch/tag/commit)'
        default: 'master'
        required: false
      frontend_ref:
        description: 'RetroArch ref to link against'
        default: 'master'
        required: false
      port_dir:
        description: 'Nama folder game PS3 yg di-share dengan CE (port dir)'
        default: 'RETROARCH'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: reallibretroretroarch/libretro-build-psl1ght:latest
      options: --user root

    steps:
      - name: Toolchain environment
        run: |
          set -eu
          : "${PS3DEV:=/usr/local/ps3dev}"
          : "${PSL1GHT:=$PS3DEV}"
          if [ -d "$PSL1GHT/portlibs" ]; then
            PORTLIBS="$PSL1GHT/portlibs"
          elif [ -d "$PS3DEV/portlibs" ]; then
            PORTLIBS="$PS3DEV/portlibs"
          else
            PORTLIBS="$PSL1GHT/portlibs"
          fi
          {
            echo "PS3DEV=$PS3DEV"
            echo "PSL1GHT=$PSL1GHT"
            echo "PORTLIBS=$PORTLIBS"
            echo "PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PS3DEV/spu/bin:$PATH"
          } >> "$GITHUB_ENV"
          echo '--- toolchain probe ---'
          ls "$PS3DEV/ppu/bin" 2>/dev/null | grep -E '^ppu-.*gcc$' | head -5 || echo 'ppu gcc NOT FOUND'
          command -v make_self fself ppu-ar 2>/dev/null || echo 'make_self/fself/ppu-ar NOT ALL FOUND'
          test -f "$PSL1GHT/ppu_rules" && echo 'ppu_rules OK' || echo 'ppu_rules MISSING'

      - name: Clone sources
        run: |
          set -eu
          command -v git >/dev/null || { apt-get update -qq && apt-get install -y -qq git; }
          clone_ref() {
            local url="$1" dir="$2" ref="$3"
            rm -rf "$dir"
            git init -q "$dir"
            ( cd "$dir" && git remote add origin "$url" \
              && git fetch -q --depth 1 origin "$ref" \
              && git checkout -q FETCH_HEAD )
            echo "$dir: $(cd "$dir" && git rev-parse --short HEAD) $(cd "$dir" && git log -1 --format=%cd --date=short)"
          }
          clone_ref https://github.com/libretro/pcsx_rearmed.git core "${{ inputs.core_ref }}"
          clone_ref https://github.com/libretro/RetroArch.git frontend "${{ inputs.frontend_ref }}"

      - name: Patch core (PS3 executable JIT memory via ps3mapi)
        run: |
          set -eu
          git clone --depth 1 \
            https://github.com/OsirizX/ps3mapi-lib.git ps3mapi-lib
          cp ps3mapi-lib/include/ps3mapi_ps3_lib.h core/include/
          cp ps3mapi-lib/source/ps3mapi_ps3_lib.c core/libpcsxcore/
          python3 - <<'EOF'
          # 1. Makefile: tambah -D__PSL1GHT__ di block psl1ght
          p = 'core/Makefile.libretro'
          s = open(p, encoding='utf-8').read()
          old = 'CFLAGS += -DBLARGG_BIG_ENDIAN=1 -D__ppc__'
          assert s.count(old) == 1, 'cflags count=%d' % s.count(old)
          s = s.replace(old, old + ' -D__PSL1GHT__ -I$(PS3DEV)/ppu/include')
          open(p, 'w', encoding='utf-8').write(s)
          print('__PSL1GHT__ define OK')

          # 2. plugin.c: includes + page_addr + local defines
          p = 'core/libpcsxcore/lightrec/plugin.c'
          s = open(p, encoding='utf-8').read()
          old_inc = '#include "mem.h"\n#include "plugin.h"'
          assert s.count(old_inc) == 1, 'inc anchor count=%d' % s.count(old_inc)
          new_inc = ('#include "mem.h"\n#include "plugin.h"\n'
                     '#ifdef __PSL1GHT__\n'
                     '#include "ps3mapi_ps3_lib.h"\n'
                     '#include <fcntl.h>\n'
                     '#include <stdint.h>\n'
                     '#include <string.h>\n'
                     '#include <ppu-lv2.h>\n'
                     '#define PS3_PAGE_SIZE_AUTO 0ULL\n'
                     'static int ps3_getpid(void) {\n'
                     '   lv2syscall8(1, 0, 0, 0, 0, 0, 0, 0, 0);\n'
                     '   return_to_user_prog(int);\n'
                     '}\n'
                     'static uint64_t lightrec_ps3_page_addr = 0;\n'
                     'static void ps3_dbglog(const char *msg) {\n'
                     '   int fd = open("/dev_hdd0/game/RETROARCH/USRDIR/ps3jit.log",\n'
                     '                 O_WRONLY | O_CREAT | O_APPEND, 0644);\n'
                     '   if (fd >= 0) { write(fd, msg, strlen(msg)); close(fd); }\n'
                     '}\n'
                     '#if LIGHTREC_CODE_INV\n'
                     'void lightrec_code_inv(void *ptr, uint32_t len) {\n'
                     '   uintptr_t start = (uintptr_t)ptr & ~127UL;\n'
                     '   uintptr_t end = (uintptr_t)ptr + len;\n'
                     '   uintptr_t addr;\n'
                     '   for (addr = start; addr < end; addr += 128)\n'
                     '      __asm__ volatile("dcbst 0, %0" :: "r"(addr) : "memory");\n'
                     '   __asm__ volatile("sync" ::: "memory");\n'
                     '   for (addr = start; addr < end; addr += 128)\n'
                     '      __asm__ volatile("icbi 0, %0" :: "r"(addr) : "memory");\n'
                     '   __asm__ volatile("isync" ::: "memory");\n'
                     '}\n'
                     '#endif\n'
                     '#endif')
          s = s.replace(old_inc, new_inc)
          print('plugin.c includes OK')

          # 3. plugin.c: code_buffer allocation via ps3mapi
          old_alloc = ("\t\tcode_buffer = malloc(CODE_BUFFER_SIZE);\n"
                       "\t\tif (!code_buffer)\n"
                       "\t\t\treturn -ENOMEM;")
          assert s.count(old_alloc) == 1, 'alloc anchor count=%d' % s.count(old_alloc)
          new_alloc = ("\t\t#ifdef __PSL1GHT__\n"
                       "\t\t{\n"
                       "\t\t\tchar dbgbuf[128];\n"
                       "\t\t\tint pid = ps3_getpid();\n"
                       "\t\t\tsnprintf(dbgbuf, sizeof(dbgbuf),\n"
                       "\t\t\t\t \"ps3jit: plugin alloc start, pid=%d, size=%u\\n\",\n"
                       "\t\t\t\t pid, (unsigned)CODE_BUFFER_SIZE);\n"
                       "\t\t\tps3_dbglog(dbgbuf);\n"
                       "\t\t\tif (ps3mapi_process_page_allocate(pid,\n"
                       "\t\t\t\t\t\t\tCODE_BUFFER_SIZE, PS3_PAGE_SIZE_AUTO,\n"
                       "\t\t\t\t\t\t\t0x2F, 1,\n"
                       "\t\t\t\t\t\t\t&lightrec_ps3_page_addr) != 0 ||\n"
                       "\t\t\t    !lightrec_ps3_page_addr) {\n"
                       "\t\t\t\tps3_dbglog(\"ps3jit: plugin alloc FAILED\\n\");\n"
                       "\t\t\t\treturn -ENOMEM;\n"
                       "\t\t\t}\n"
                       "\t\t\tsnprintf(dbgbuf, sizeof(dbgbuf),\n"
                       "\t\t\t\t \"ps3jit: plugin alloc OK @ %p\\n\",\n"
                       "\t\t\t\t (void *)lightrec_ps3_page_addr);\n"
                       "\t\t\tps3_dbglog(dbgbuf);\n"
                       "\t\t\tcode_buffer = (void *)lightrec_ps3_page_addr;\n"
                       "\t\t\tSysPrintf(\"lightrec: PS3 executable code buffer @ %p (ps3mapi OK)\\n\",\n"
                       "\t\t\t\t  code_buffer);\n"
                       "\t\t}\n"
                       "\t\t#else\n"
                       "\t\tcode_buffer = malloc(CODE_BUFFER_SIZE);\n"
                       "\t\tif (!code_buffer)\n"
                       "\t\t\treturn -ENOMEM;\n"
                       "\t\t#endif")
          s = s.replace(old_alloc, new_alloc)
          print('plugin.c alloc OK')

          # 4. plugin.c: cleanup (no-op, no page_free API)
          old_free = ("\t\tfree(code_buffer);\n"
                      "#endif\n"
                      "\t}\n"
                      "}\n"
                      "\n"
                      "static void lightrec_plugin_reset(void)")
          assert s.count(old_free) == 1, 'free anchor count=%d' % s.count(old_free)
          new_free = ("\t\t#ifdef __PSL1GHT__\n"
                      "\t\t(void)code_buffer;\n"
                      "\t\t#else\n"
                      "\t\tfree(code_buffer);\n"
                      "\t\t#endif\n"
                      "#endif\n"
                      "\t}\n"
                      "}\n"
                      "\n"
                      "static void lightrec_plugin_reset(void)")
          s = s.replace(old_free, new_free)
          open(p, 'w', encoding='utf-8').write(s)
          print('plugin.c free OK')

          # 5. plugin.c: heartbeat log di execute
          p = 'core/libpcsxcore/lightrec/plugin.c'
          s = open(p, encoding='utf-8').read()
          old_exec = "static void lightrec_plugin_execute_internal(bool block_only)"
          assert s.count(old_exec) == 1, 'exec anchor count=%d' % s.count(old_exec)
          new_exec = ("#ifdef __PSL1GHT__\n"
                      "static void ps3_exec_log(const char *msg) {\n"
                      "   int fd = open(\"/dev_hdd0/game/RETROARCH/USRDIR/ps3jit.log\",\n"
                      "                 O_WRONLY | O_CREAT | O_APPEND, 0644);\n"
                      "   if (fd >= 0) { write(fd, msg, strlen(msg)); close(fd); }\n"
                      "}\n"
                      "#endif\n"
                      "static void lightrec_plugin_execute_internal(bool block_only)")
          s = s.replace(old_exec, new_exec)
          old_body2 = ("#endif\n"
                       "static void lightrec_plugin_execute_internal(bool block_only)\n"
                       "{")
          assert s.count(old_body2) == 1, 'exec body count=%d' % s.count(old_body2)
          new_body2 = ("#endif\n"
                       "static void lightrec_plugin_execute_internal(bool block_only)\n"
                       "{\n"
                       "#ifdef __PSL1GHT__\n"
                       "   {\n"
                       "      char b[64];\n"
                       "      snprintf(b, sizeof(b), \"ps3jit: execute start, pc=%08x\\n\", (unsigned)psxRegs.pc);\n"
                       "      ps3_exec_log(b);\n"
                       "   }\n"
                       "#endif")
          s = s.replace(old_body2, new_body2)
          open(p, 'w', encoding='utf-8').write(s)
          print('plugin.c execute heartbeat OK')
          EOF

      - name: Patch Lightning (PS3 function descriptor / TOC)
        run: |
          set -eu
          python3 - <<'EOF'
          p = 'core/deps/lightning/lib/jit_ppc-cpu.c'
          s = open(p, encoding='utf-8').read()

          # 1. _callr(): PS3 descriptor handling
          old_call = ("       )\n"
                      "{\n"
                      "#  if _CALL_AIXDESC\n"
                      "    stxi(sizeof(void*) * 5, _SP_REGNO, _R2_REGNO);")
          assert s.count(old_call) == 1, 'callr anchor count=%d' % s.count(old_call)
          new_call = ("       )\n"
                      "{\n"
                      "#  if defined(__PSL1GHT__) || defined(__PS3__) || defined(__powerpc64__)\n"
                      "    stxi(sizeof(void*) * 5, _SP_REGNO, _R2_REGNO);\n"
                      "    if (r0 == _R0_REGNO) {\n"
                      "        movr(_R11_REGNO, _R0_REGNO);\n"
                      "        ldxi(_R2_REGNO, _R11_REGNO, sizeof(void*));\n"
                      "        ldr(_R11_REGNO, _R11_REGNO);\n"
                      "        movr(_R0_REGNO, _R11_REGNO);\n"
                      "    }\n"
                      "    else {\n"
                      "        ldxi(_R2_REGNO, r0, sizeof(void*));\n"
                      "        ldr(r0, r0);\n"
                      "    }\n"
                      "#  elif _CALL_AIXDESC\n"
                      "    stxi(sizeof(void*) * 5, _SP_REGNO, _R2_REGNO);")
          s = s.replace(old_call, new_call)
          print('_callr PS3 descriptor OK')

          # 2. _callr(): restore r2 buat PS3
          old_restore = ("#  if _CALL_AIXDESC\n"
                         "    ldxi(_R2_REGNO, _SP_REGNO, sizeof(void*) * 5);\n"
                         "#  endif\n"
                         "}\n"
                         "\n"
                         "/* assume fixed address or reachable address */")
          assert s.count(old_restore) == 1, 'restore anchor count=%d' % s.count(old_restore)
          new_restore = ("#  if defined(__PSL1GHT__) || defined(__PS3__) || defined(__powerpc64__) || _CALL_AIXDESC\n"
                         "    ldxi(_R2_REGNO, _SP_REGNO, sizeof(void*) * 5);\n"
                         "#  endif\n"
                         "}\n"
                         "\n"
                         "/* assume fixed address or reachable address */")
          s = s.replace(old_restore, new_restore)
          print('_callr r2 restore OK')

          # 3. _calli(): paksa lewat callr di PS3 (jangan BL langsung)
          old_calli = ("    jit_word_t\t\tw;\n"
                       "#  if _CALL_SYSV\n"
                       "    jit_word_t\t\td;\n"
                       "    d = (i0 - _jit->pc.w - !!varargs * 4) & ~3;\n"
                       "    if (can_sign_extend_jump_p(d)) {")
          assert s.count(old_calli) == 1, 'calli anchor count=%d' % s.count(old_calli)
          new_calli = ("    jit_word_t\t\tw;\n"
                       "#  if _CALL_SYSV\n"
                       "    jit_word_t\t\td;\n"
                       "#   if defined(__PSL1GHT__) || defined(__PS3__) || defined(__powerpc64__)\n"
                       "    (void)d;\n"
                       "    if (0) {\n"
                       "#   else\n"
                       "    d = (i0 - _jit->pc.w - !!varargs * 4) & ~3;\n"
                       "    if (can_sign_extend_jump_p(d)) {\n"
                       "#   endif")
          s = s.replace(old_calli, new_calli)
          open(p, 'w', encoding='utf-8').write(s)
          print('_calli PS3 force-callr OK')
          EOF

      - name: Patch core (PS3 JIT fallback to interpreter)
        run: |
          set -eu
          python3 - <<'EOF'
          p = 'core/frontend/libretro.c'
          s = open(p, encoding='utf-8').read()
          old_func = "bool retro_load_game(const struct retro_game_info *info)"
          assert s.count(old_func) == 1, 'func count=%d' % s.count(old_func)
          helper = (
              "#ifdef __PSL1GHT__\n"
              '#include "ps3mapi_ps3_lib.h"\n'
              '#include <fcntl.h>\n'
              '#include <string.h>\n'
              '#include <ppu-lv2.h>\n'
              "#define PS3_PAGE_SIZE_AUTO 0ULL\n"
              "static int ps3_getpid(void) {\n"
              "   lv2syscall8(1, 0, 0, 0, 0, 0, 0, 0, 0);\n"
              "   return_to_user_prog(int);\n"
              "}\n"
              "static void ps3_probe_log(const char *msg) {\n"
              "   int fd = open(\"/dev_hdd0/game/RETROARCH/USRDIR/ps3jit.log\",\n"
              "                 O_WRONLY | O_CREAT | O_APPEND, 0644);\n"
              "   if (fd >= 0) { write(fd, msg, strlen(msg)); close(fd); }\n"
              "}\n"
              "static int ps3_jit_memory_available(void)\n"
              "{\n"
              "   static int checked = 0;\n"
              "   static int available = 0;\n"
              "   if (!checked) {\n"
              "      uint64_t test_addr = 0;\n"
              "      int pid = ps3_getpid();\n"
              "      char dbgbuf[128];\n"
              '      snprintf(dbgbuf, sizeof(dbgbuf), "ps3jit: probe start, pid=%d\\n", pid);\n'
              "      ps3_probe_log(dbgbuf);\n"
              "      if (ps3mapi_process_page_allocate(pid, 650 * 1024,\n"
              "                                        PS3_PAGE_SIZE_AUTO, 0x2F, 1,\n"
              "                                        &test_addr) == 0 &&\n"
              "          test_addr) {\n"
              '         ps3_probe_log("ps3jit: probe alloc OK\\n");\n'
              "         available = 1;\n"
              '         SysPrintf("ps3: ps3mapi executable memory OK - JIT available\\n");\n'
              "      }\n"
              "      else {\n"
              '         ps3_probe_log("ps3jit: probe FAILED\\n");\n'
              '         SysPrintf("ps3: ps3mapi FAILED (no Cobra/Mamba?) - forcing interpreter\\n");\n'
              "      }\n"
              "      checked = 1;\n"
              "   }\n"
              "   return available;\n"
              "}\n"
              "#endif\n"
              "\n"
              "bool retro_load_game(const struct retro_game_info *info)")
          s = s.replace(old_func, helper)
          print('ps3_jit_memory_available helper OK')
          old_drc = ("#ifdef _3DS\n"
                     "      if (!__ctr_svchax)\n"
                     "         Config.Cpu = CPU_INTERPRETER;\n"
                     "      else\n"
                     "#endif\n"
                     '      if (strcmp(var.value, "disabled") == 0)')
          assert s.count(old_drc) == 1, 'drc count=%d' % s.count(old_drc)
          new_drc = ("#ifdef _3DS\n"
                     "      if (!__ctr_svchax)\n"
                     "         Config.Cpu = CPU_INTERPRETER;\n"
                     "      else\n"
                     "#endif\n"
                     "#ifdef __PSL1GHT__\n"
                     "      if (!ps3_jit_memory_available())\n"
                     "         Config.Cpu = CPU_INTERPRETER;\n"
                     "      else\n"
                     "#endif\n"
                     '      if (strcmp(var.value, "disabled") == 0)')
          s = s.replace(old_drc, new_drc)
          open(p, 'w', encoding='utf-8').write(s)
          print('PS3 JIT fallback OK')
          EOF

      - name: Patch core (drc default off + PPC define)
        run: |
          set -eu
          python3 - <<'EOF'
          p = 'core/frontend/libretro_core_options.h'
          s = open(p, encoding='utf-8').read()
          i = s.find('"pcsx_rearmed_drc",')
          assert i != -1, 'drc key not found'
          seg = s[i:i+1500]
          old = '         { NULL, NULL },\n      },\n      "enabled",'
          assert seg.count(old) == 1, 'drc default anchor count=%d' % seg.count(old)
          seg = seg.replace(old, '         { NULL, NULL },\n      },\n      "disabled",')
          s = s[:i] + seg + s[i+1500:]
          open(p, 'w', encoding='utf-8').write(s)
          print('drc default -> disabled OK')
          p = 'core/Makefile.libretro'
          s = open(p, encoding='utf-8').read()
          old = 'CFLAGS += -DBLARGG_BIG_ENDIAN=1 -D__ppc__ -D__PSL1GHT__ -I$(PS3DEV)/ppu/include'
          assert s.count(old) == 1, 'ppc cflags count=%d' % s.count(old)
          s = s.replace(old, old + ' -D__powerpc__')
          open(p, 'w', encoding='utf-8').write(s)
          print('__powerpc__ define OK')
          EOF

      - name: Align port dir with CE
        run: |
          set -eu
          PORT_DIR="${{ inputs.port_dir }}"
          f=frontend/frontend/drivers/platform_ps3.c
          grep -q '#define EMULATOR_CONTENT_DIR "SSNE10001"' "$f"
          sed -i "s/#define EMULATOR_CONTENT_DIR \"SSNE10001\"/#define EMULATOR_CONTENT_DIR \"$PORT_DIR\"/" "$f"
          grep -n '#define EMULATOR_CONTENT_DIR' "$f"

      - name: Apply CE return-to-menu patch
        run: |
          set -eu
          python3 - <<'EOF'
          p = 'frontend/retroarch.c'
          s = open(p, encoding='utf-8').read()
          anchor = "      case CMD_EVENT_UNLOAD_CORE:\n         {\n"
          assert s.count(anchor) == 1, 'anchor count=%d' % s.count(anchor)
          patch = ("      case CMD_EVENT_UNLOAD_CORE:\n"
                   "         {\n"
                   "            command_event(CMD_EVENT_RESTART_RETROARCH, NULL);\n"
                   "            break;\n")
          open(p, 'w', encoding='utf-8').write(s.replace(anchor, patch))
          print('return-to-menu patch OK')
          EOF

      - name: Build core (static lib)
        run: |
          set -eu
          cd core
          make -f Makefile.libretro platform=psl1ght LIGHTREC_CODE_INV=1 -j"$(nproc)" V=1
          PPU_INC="${PS3DEV}/ppu/include"
          GEN_INC="${PSL1GHT:-/usr/local/ps3dev}/include"
          "$PS3DEV/ppu/bin/ppu-gcc" -O2 -D__PSL1GHT__ \
            -I"$PPU_INC" -I"$GEN_INC" -Iinclude \
            -c libpcsxcore/ps3mapi_ps3_lib.c -o libpcsxcore/ps3mapi_ps3_lib.o
          ppu-ar rcs pcsx_rearmed_libretro_psl1ght.a libpcsxcore/ps3mapi_ps3_lib.o
          ppu-ar t pcsx_rearmed_libretro_psl1ght.a | grep -i ps3mapi
          ls -la pcsx_rearmed_libretro_psl1ght.a

      - name: Link frontend + core, make SELF
        run: |
          set -eu
          cp core/pcsx_rearmed_libretro_psl1ght.a frontend/libretro_psl1ght.a
          cd frontend
          make -f Makefile.psl1ght -j"$(nproc)" V=1
          ls -la retroarch_psl1ght.self

      - name: Fetch menu assets (RGUI)
        run: |
          set -eu
          rm -rf assets-src
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/libretro/retroarch-assets.git assets-src
          cd assets-src
          if git sparse-checkout init --cone 2>/dev/null; then
            git sparse-checkout set rgui
          else
            echo 'sparse-checkout tidak didukung git ini -> checkout penuh'
          fi
          git checkout
          cd ..
          mkdir -p dist/assets
          cp -r assets-src/rgui dist/assets/
          echo "assets commit: $(cd assets-src && git rev-parse --short HEAD)"
          find dist/assets -type f | wc -l
          du -sh dist/assets

      - name: Package artifact
        run: |
          set -eu
          SELF_NAME='pcsx_rearmed_libretro_ps3.SELF'
          PORT_DIR="${{ inputs.port_dir }}"
          cp frontend/retroarch_psl1ght.self "dist/$SELF_NAME"
          {
            echo "core:     libretro/pcsx_rearmed @ $(cd core && git rev-parse --short HEAD)"
            echo "frontend: libretro/RetroArch @ $(cd frontend && git rev-parse --short HEAD)"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "FIX: _calli PS3 force-callr (c_wrapper descriptor fix)"
          } > dist/BUILD_INFO.txt
          find dist -type f | sort

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: pcsx_rearmed_libretro_ps3
          path: dist/
